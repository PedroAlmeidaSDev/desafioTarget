spring.application.name=desafio

# Arquivos de dados. Podem ser trocados sem recompilar, por exemplo:
#   java -jar desafio.jar --desafio.dados.vendas=file:/tmp/outras-vendas.json
desafio.dados.vendas=classpath:dados/vendas.json
desafio.dados.estoque=classpath:dados/estoque.json

# Fuso usado para definir a data de "hoje" no cálculo de juros.
desafio.fuso-horario=America/Sao_Paulo

# Quantidades e códigos são inteiros: sem isto, o Jackson aceitaria "quantidade": 1.5 e gravaria 1.
spring.jackson.deserialization.accept-float-as-int=false

# Swagger UI em /swagger-ui.html, operações ordenadas pelo método HTTP.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
